<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c2"/>
      <stop offset="60%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#02030a"/>
    </radialGradient>
  </defs>

  <rect width="800" height="320" rx="16" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="270" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="60" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="35" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="280" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="70" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="160" r="0.9"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="190" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(400 160)">
    <!-- orbit rings -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 6">
      <circle r="55"/>
      <circle r="90"/>
      <circle r="125"/>
      <circle r="160"/>
    </g>

    <!-- sun -->
    <circle r="34" fill="url(#sun)">
      <animate attributeName="r" values="32;37;32" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#ffd166"/>

    <!-- Mercury -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <circle cx="55" r="4" fill="#b5b5b5"/>
    </g>
    <!-- Venus -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="10s" repeatCount="indefinite"/>
      <circle cx="90" r="6" fill="#e6c27a"/>
    </g>
    <!-- Earth + Moon -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="140" to="500" dur="15s" repeatCount="indefinite"/>
      <circle cx="125" r="7" fill="#3b82f6"/>
      <g transform="translate(125 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.5s" repeatCount="indefinite"/>
          <circle cx="13" r="2" fill="#d9d9d9"/>
        </g>
      </g>
    </g>
    <!-- Mars -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="250" to="610" dur="22s" repeatCount="indefinite"/>
      <circle cx="160" r="5" fill="#c1440e"/>
    </g>
  </g>
</svg>
